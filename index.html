<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch A1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Deutsch A1 Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Mundo único y claro: papel cálido, botones "de goma" con sombra inferior, colores de artículo del libro (der azul, das verde, die rojo) */
  --bg:#fff8ec;
  --card:#ffffff;
  --ink:#2b2a33;
  --muted:#7d7a86;
  --line:#ece4d4;
  --accent:#ff7a1a;
  --accent-d:#d95f00;
  --der:#1f6feb; --der-d:#1650ad; --der-l:#e3eeff;
  --das:#13a05a; --das-d:#0c7440; --das-l:#ddf6e8;
  --die:#e5484d; --die-d:#b3282d; --die-l:#ffe3e3;
  --ok:#13a05a; --ok-l:#d9f7e5; --bad:#e5484d; --bad-l:#ffe1e1;
  --gold:#ffc23d;
  --font:'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-weight:800;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:2px solid var(--line)}
.brand{font-weight:900;font-size:20px;letter-spacing:-.3px;flex:1;display:flex;align-items:center;gap:8px}
.flag{display:inline-flex;flex-direction:column;width:22px;height:16px;border-radius:4px;overflow:hidden}
.flag i{flex:1}.flag i:nth-child(1){background:#222}.flag i:nth-child(2){background:#dd2b2b}.flag i:nth-child(3){background:#ffc23d}
.stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px}
.stat svg{width:22px;height:22px}
.stat.fire{color:#ff8a00}.stat.xp{color:#c98d00}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:540px;width:100%;display:flex}
.tab{flex:1;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}
main{flex:1;padding:16px}
.view{display:none}.view.on{display:block}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:22px 4px 10px;font-weight:900}
h2.sec:first-child{margin-top:4px}
/* hero */
.hero{background:linear-gradient(135deg,#fff 0%,#fff3df 100%);border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero h1{margin:0 0 4px;font-size:21px;font-weight:900;line-height:1.15;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.ring{width:64px;height:64px;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;text-align:center;line-height:1.05}
/* unit card */
.unit{background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:12px;overflow:hidden}
.unit .uh{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 4px}
.unit .badge{flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit h3{margin:0;font-size:17px;font-weight:900;line-height:1.2}
.unit .d{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.35}
.unit .lv{display:flex;align-items:center;gap:12px;padding:10px 14px 14px}
.lvb{width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;font-size:18px;color:#fff;background:var(--c);box-shadow:0 5px 0 var(--cd);transition:transform .08s}
.lvb:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.lvb.done{background:var(--gold);box-shadow:0 5px 0 #d49a12;color:#5a3b00}
.lvb svg{width:24px;height:24px}
.lvlabel{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;font-weight:800}
.lvwrap{display:flex;flex-direction:column;align-items:center}
.tipbtn{margin-left:auto;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 14px 12px}
.prog i{display:block;height:100%;background:var(--gold);border-radius:6px}
/* practice cards */
.pcard{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px;box-shadow:0 4px 0 var(--line)}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pcard .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.pcard .ic svg{width:28px;height:28px}
.pcard h3{margin:0;font-size:17px;font-weight:900}
.pcard p{margin:2px 0 0;color:var(--muted);font-size:13px;font-weight:700}
.pcard .meta{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
/* dictionary */
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.legend{display:flex;gap:8px;margin-bottom:10px}
.legend span{flex:1;text-align:center;border-radius:12px;padding:6px;font-size:13px;font-weight:900}
.w{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-left-width:8px;border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.w.der{border-left-color:var(--der)}.w.das{border-left-color:var(--das)}.w.die{border-left-color:var(--die)}
.w .a{font-weight:900;min-width:34px}
.w.der .a{color:var(--der)}.w.das .a{color:var(--das)}.w.die .a{color:var(--die)}
.w .n{font-size:16px;font-weight:900}
.w .pl{font-size:12px;color:var(--muted);font-weight:700}
.w .es{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.count{font-size:12px;color:var(--muted);margin:0 4px 8px}
/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:20;background:#fff;display:none;flex-direction:column}
.lesson.on{display:flex}
.lt{max-width:540px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.x{background:none;border:0;padding:4px;color:#b6b2be}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;background:#eee8dc;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.timer{font-weight:900;color:var(--accent);min-width:44px;text-align:right}
.lbody{flex:1;overflow:auto;max-width:540px;width:100%;margin:0 auto;padding:10px 16px 20px}
.qt{font-size:22px;font-weight:900;margin:8px 0 14px;line-height:1.2;text-wrap:balance}
.qprompt{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.qprompt .bubble{border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px;font-weight:800;line-height:1.35;flex:1}
.spk{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:0;background:var(--der);color:#fff;box-shadow:0 4px 0 var(--der-d);display:grid;place-items:center}
.spk svg{width:24px;height:24px}
.spk.sm{width:36px;height:36px;border-radius:10px;box-shadow:0 3px 0 var(--der-d)}
.spk.sm svg{width:18px;height:18px}
.wordcard{text-align:center;border:2px solid var(--line);border-radius:22px;padding:30px 48px 20px;margin:4px 0 22px;position:relative}
.wordcard .big.l{font-size:30px}.wordcard .big.xl{font-size:25px}
.wordcard .big{font-size:38px;font-weight:900;letter-spacing:-.5px;word-break:break-word}
.wordcard .sub{color:var(--muted);font-size:15px;margin-top:4px}
.wordcard .spk{position:absolute;right:10px;top:10px}
.wordcard.der{border-color:var(--der);background:var(--der-l)}.wordcard.das{border-color:var(--das);background:var(--das-l)}.wordcard.die{border-color:var(--die);background:var(--die-l)}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ab{border:0;border-radius:18px;padding:20px 0;font-size:24px;color:#fff;transition:transform .08s,filter .15s}
.ab.der{background:var(--der);box-shadow:0 6px 0 var(--der-d)}
.ab.das{background:var(--das);box-shadow:0 6px 0 var(--das-d)}
.ab.die{background:var(--die);box-shadow:0 6px 0 var(--die-d)}
.ab:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.ab.sel{outline:4px solid var(--ink);outline-offset:3px}
.ab.dim{filter:grayscale(.85) opacity(.45)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.ob{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 12px;font-size:18px;text-align:center;box-shadow:0 4px 0 var(--line);line-height:1.25;word-break:break-word}
.ob:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ob.sel{border-color:var(--der);background:var(--der-l);box-shadow:0 4px 0 #9fc2ff;color:var(--der-d)}
.ob.right{border-color:var(--ok);background:var(--ok-l);box-shadow:0 4px 0 #8edbb1;color:var(--das-d)}
.ob.wrong{border-color:var(--bad);background:var(--bad-l);box-shadow:0 4px 0 #ffb0b0;color:var(--die-d)}
.ob:disabled{cursor:default}
/* tiles */
.answer{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:8px}
.preview{min-height:24px;color:var(--muted);font-size:15px;margin-bottom:14px;word-break:break-all}
.preview b{color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:17px;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
/* input */
.inp{width:100%;font:inherit;font-size:20px;font-weight:800;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fbfaf7;color:var(--ink)}
.uml{display:flex;gap:8px;margin-top:10px}
.uml button{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 0;font-size:18px;box-shadow:0 3px 0 var(--line)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mb{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 8px;font-size:15px;box-shadow:0 3px 0 var(--line);min-height:54px}
.mb.sel{border-color:var(--der);background:var(--der-l)}
.mb.ok{border-color:var(--ok);background:var(--ok-l);color:var(--das-d);opacity:.55}
.mb.no{border-color:var(--bad);background:var(--bad-l);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* footer */
.lf{border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;transition:background .2s}
.lf .in{max-width:540px;margin:0 auto}
.lf.ok{background:var(--ok-l);border-color:transparent}
.lf.bad{background:var(--bad-l);border-color:transparent}
.fb{display:none;margin-bottom:12px}
.lf.ok .fb,.lf.bad .fb{display:block}
.fb h4{margin:0 0 4px;font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.lf.ok .fb h4{color:var(--das-d)}.lf.bad .fb h4{color:var(--die-d)}
.fb .sol{font-size:16px;font-weight:900;margin-bottom:4px}
.lf.bad .fb .sol{color:var(--die-d)}
.fb p{margin:0;font-size:14px;line-height:1.4;color:#4a4752;font-weight:700}
.fb .row{display:flex;gap:10px;align-items:flex-start}
.big-btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;letter-spacing:.6px;text-transform:uppercase;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d)}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.big-btn:disabled{background:#e9e4da;color:#b2aca0;box-shadow:0 5px 0 #d8d1c4;cursor:default;transform:none}
.lf.ok .big-btn{background:var(--ok);box-shadow:0 5px 0 var(--das-d)}
.lf.bad .big-btn{background:var(--bad);box-shadow:0 5px 0 var(--die-d)}
.ghost{width:100%;border:2px solid var(--line);border-radius:16px;padding:13px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;background:#fff;box-shadow:0 4px 0 var(--line);margin-top:10px}
/* end screen */
.end{text-align:center;padding:30px 6px}
.end .medal{width:120px;height:120px;margin:0 auto 10px}
.end h2{font-size:28px;font-weight:900;margin:6px 0}
.end p{color:var(--muted);margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.kpi{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.kpi div{font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:5px;color:#fff;font-weight:900}
.kpi b{display:block;font-size:22px;padding:10px 4px;font-variant-numeric:tabular-nums}
.errs{text-align:left;margin-top:8px}
.errs h3{font-size:15px;margin:16px 0 8px}
.err{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.err .q{color:var(--muted);font-weight:700}
.err .s{color:var(--das-d);font-weight:900}
/* sheet (modal) */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,25,20,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:#fff;width:100%;max-width:540px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:86%;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:20px;font-weight:900}
.sheet .tip{font-size:15px;line-height:1.5;font-weight:700;color:#3f3c46}
.sheet .tip table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
.sheet .tip td,.sheet .tip th{border:2px solid var(--line);padding:6px 8px;text-align:left}
.sheet .tip th{background:#faf5ea}
.tder{color:var(--der);font-weight:900}.tdas{color:var(--das);font-weight:900}.tdie{color:var(--die);font-weight:900}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none}
.blitzflash{position:fixed;inset:0;pointer-events:none;z-index:21;opacity:0;transition:opacity .25s}
.small{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4}
.settings{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
/* resultado de artículos: verde si aciertas, rojo si fallas */
.wordcard.good{border-color:var(--ok);background:var(--ok-l)}
.wordcard.bad{border-color:var(--bad);background:var(--bad-l)}
.wordcard .res{margin-top:8px;font-size:20px;font-weight:900}
.wordcard .res .der{color:var(--der)}.wordcard .res .das{color:var(--das)}.wordcard .res .die{color:var(--die)}
.ab.right{outline:4px solid var(--ok);outline-offset:3px}
.ab.right::after{content:' ✓'}
.ab.wrongsel{outline:4px solid var(--bad);outline-offset:3px;filter:grayscale(.5) opacity(.6)}
.ab.wrongsel::after{content:' ✗'}
/* traducción oculta */
.esbtn{margin-top:10px;background:#fff;border:2px dashed #d9cfbb;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.wordcard .sub,.qsub{color:var(--muted);font-size:15px;margin-top:8px}
.qsub{margin:-6px 0 10px;text-align:center}
.hintwrap{text-align:center;margin:-4px 0 8px}
/* hablar */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0 6px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--die);color:#fff;box-shadow:0 6px 0 var(--die-d);display:grid;place-items:center;transition:transform .08s}
.mic svg{width:44px;height:44px}
.mic:active{transform:translateY(5px);box-shadow:0 1px 0 var(--die-d)}
.mic.on{background:var(--die-d);animation:pulse 1.1s infinite}
.mic:disabled{filter:grayscale(.8) opacity(.5);cursor:default;transform:none}
@keyframes pulse{0%{box-shadow:0 6px 0 #8f1f23,0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 6px 0 #8f1f23,0 0 0 22px rgba(229,72,77,0)}100%{box-shadow:0 6px 0 #8f1f23,0 0 0 0 rgba(229,72,77,0)}}
.micst{font-size:15px;color:var(--muted);text-align:center;min-height:22px;line-height:1.35}
.heard{font-size:18px;text-align:center;line-height:1.45;word-break:break-word}
.heard .g{color:var(--das-d)}.heard .r{color:var(--die-d);font-weight:900}
.tries{font-size:14px;color:var(--die-d);text-align:center;min-height:18px;line-height:1.35}
/* teoría */
.th{background:#fff;border:2px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.th>summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:12px;line-height:1.2}
.th>summary::-webkit-details-marker{display:none}
.th>summary::after{content:'';margin-left:auto;flex:0 0 auto;width:9px;height:9px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.th[open]>summary::after{transform:rotate(-135deg)}
.th .tic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:16px;font-weight:900;flex:0 0 auto}
.th .tb{padding:0 16px 16px;font-size:15px;line-height:1.55;font-weight:700;color:#3f3c46}
.th .tb p{margin:8px 0}
.th h4{margin:16px 0 6px;font-size:15px;font-weight:900;color:var(--ink)}
.tw{overflow-x:auto;margin:8px 0}
.tw table{border-collapse:collapse;width:100%;font-size:14px}
.tw td,.tw th{border:2px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tw th{background:#faf5ea}
.step{display:flex;gap:10px;margin:12px 0}
.step .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.sy{border:0;background:#f3eee4;border-radius:8px;padding:1px 7px;margin:1px 0;font-size:inherit;font-weight:800;line-height:1.5;color:var(--ink)}
.sy.der b{color:var(--der)}.sy.das b{color:var(--das)}.sy.die b{color:var(--die)}
.sy:active{background:#e6dfd1}
.note{background:#fff6e0;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}

function conj(v){
  if(v.f) return v.f;
  const st=v.inf.replace(/e?n$/,'');
  if(/[td]$/.test(st)) return [st+'e',st+'est',st+'et',st+'en',st+'et',st+'en'];

  return [st+'e',st+'st',st+'t',st+'en',st+'t',st+'en'];
}

const ONES=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function t100(n){ // tokens 1..99
  if(n<20) return [ONES[n]];
  const u=n%10, t=Math.floor(n/10);
  if(!u) return [TENS[t]];
  return [u===1?'ein':ONES[u],'und',TENS[t]];
}
function t1000(n){ // 1..999
  const h=Math.floor(n/100), r=n%100, out=[];
  if(h) { if(h>1) out.push(ONES[h]); out.push('hundert'); }
  if(r) out.push(...t100(r));
  return out;
}
function numTok(n){
  if(n===0) return ['null'];
  const th=Math.floor(n/1000), r=n%1000, out=[];
  if(th){ if(th>1){ const tt=t1000(th); if(tt[tt.length-1]==='eins') tt[tt.length-1]='ein'; out.push(...tt);} out.push('tausend'); }
  if(r) out.push(...t1000(r));
  return out;
}
const numDe = n => numTok(n).join('');
function yearTok(y){
  if(y>=2000 || y<1100) return numTok(y);
  const c=Math.floor(y/100), r=y%100, out=[...t100(c),'hundert'];
  if(r) out.push(...t100(r));
  return out;
}
const fmt = n => n.toLocaleString('de-DE');
function numWrongs(n, word){
  const s=new Set();
  const r=n%100, u=r%10, t=Math.floor(r/10);
  if(t>=2 && u && u!==t){ const sw=n-r+u*10+t; s.add(numDe(sw)); }
  if(t>=2 && u){ // orden "inglés"
    const base=numTok(n-r).filter(x=>x!=='null').join('');
    s.add(base + TENS[t] + 'und' + (u===1?'eins':ONES[u]));
  }
  const subs=[['sechzig','sechszig'],['siebzig','siebenzig'],['dreißig','dreizig'],['sechzehn','sechszehn'],['siebzehn','siebenzehn'],['einund','einsund'],['zwölf','zweizehn'],['elf','einzehn'],['zwanzig','zweizig']];
  for(const [a,b] of subs) if(word.includes(a)) s.add(word.replace(a,b));
  // vecinos
  s.add(numDe(n+10>999999?n-10:n+10)); s.add(numDe(Math.max(0,n-1)));
  s.delete(word);
  return [...s];
}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function niceNum(range){
  switch(range){
    case 'a': return randInt(0,20);
    case 'b': return randInt(21,99);
    case 'c': { const k=Math.random();
      if(k<.35) return randInt(100,999);
      if(k<.6) return randInt(1000,9999);
      if(k<.8) return randInt(10,99)*1000 + (Math.random()<.5?0:randInt(1,999));
      return randInt(1,9)*100000 + randInt(0,99)*1000; }
  }
}

  const toks=yearTok(y), w=toks.join('');
  if(Math.random()<.5){
    const wrong=[numDe(y)];
    if(y<2000){ wrong.push(t100(Math.floor(y/100)).join('')+'hundert'+(y%100?numDe(y%100).replace(/^ein$/,'eins'):'')+'s'); wrong.push(numDe(y+1));
      wrong.push((y<2000? t100(Math.floor(y/100)).join('')+'hundert':'')+numWrongs(y%100||21,numDe(y%100||21))[0]); }
    else wrong.push('zwanzig'+numDe(y%100)), wrong.push(numDe(y+10));
    return {type:'choice',title:'¿Cómo se dice este año?',prompt:String(y),big:true,options:opts(w,wrong),answer:w,say:w,sol:w,
      explain: y<2000?'Años antes de 2000: en centenas. 1792 = siebzehnhundertzweiundneunzig.':'Desde 2000: número normal. 2017 = zweitausendsiebzehn.'};
  }
  return Object.assign(qNumTiles(y,toks),{title:'Construye el año',prompt:String(y),explain:y<2000?'Años antes de 2000 en centenas: siebzehn-hundert-…':'Desde 2000: zweitausend…'});
}
function qPrice(){
  const e=randInt(1,99), c=pick([0,10,20,49,50,90,95,99]);
  const ew = e===1?'ein':numDe(e);
  const w = c? `${ew} Euro ${numDe(c)}` : `${ew} Euro`;
  const wrong=[ `${ew} Euros ${numDe(c||50)}`, `${ew} Komma ${numDe(c||50)} Euro`, `${numDe(swapNum(e)).replace(/^eins$/,'ein')} Euro ${numDe(c||20)}`];
  return {type:'choice',title:'¿Cómo se dice el precio?',prompt:c?`${e},${String(c).padStart(2,'0')} €`:`${e} €`,big:true,options:opts(w,wrong),answer:w,say:w,sol:w,
    explain:'Precios: euros + Euro + céntimos. Euro no lleva -s con números.'};
}

function qVerb(v, input){
  const P=pick(PERSONS); const forms=conj(v); const ans=forms[P.i];
  const subj=P.p+(P.h?` (${P.h})`:'');
  if(input) return {type:'input',title:`Conjuga: ${v.inf} (${v.es})`,prompt:`${subj} ___`,answers:[ans],say:`${P.p} ${ans}`,sol:`${P.p} ${ans}`,explain:verbRule(v,P.i)};
  const wrong=[...verbWrong(v,P.i),...forms].filter(f=>f!==ans);
  return {type:'choice',title:`Conjuga: ${v.inf} (${v.es})`,prompt:`${subj} ___`,options:opts(ans,wrong),two:true,answer:ans,say:`${P.p} ${ans}`,sol:`${P.p} ${ans}`,explain:verbRule(v,P.i)};
}
function qSH(){
  const [p,a,e]=pick(SH);

  const cap=/^[A-Z]/.test(a);
  const pool=base.map(x=>cap?x[0].toUpperCase()+x.slice(1):x);
  return {type:'choice',title:'¿sein o haben?',prompt:p,options:opts(a,pool),two:true,answer:a,say:p.replace('___',a),sol:p.replace('___',a),explain:e};
}

function nounLesson(pool, lvl){
  const ns=shuffle(pool);

const KEY='deutschA1_v1';
let S={xp:0,streak:0,last:'',done:{},blitz:0,mist:[],daily:{d:'',xp:0},sound:true,goal:50,showEs:false,spkIntro:false};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function addXP(x){
  const t=today();
  if(S.daily.d!==t) S.daily={d:t,xp:0};
  S.daily.xp+=x; S.xp+=x;
  if(S.last!==t){
    const y=new Date(); y.setDate(y.getDate()-1);
    const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    S.streak = (S.last===yk) ? S.streak+1 : 1; S.last=t;
  }
  save(); renderStats();
}
function renderStats(){
  let st=S.streak; if(S.last){ const y=new Date(); y.setDate(y.getDate()-1); const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate(); if(S.last!==today() && S.last!==yk) st=0; }
  $('#streak').textContent=st; $('#xp').textContent=S.xp;
}
function pushMistake(q){
  if(q.type==='match') return;
  const key=q.title+'|'+(q.prompt||q.word||q.listen);
  const clean=Object.assign({},q); delete clean._retry; delete clean._picked; delete clean._m; delete clean._tries;
  S.mist=S.mist.filter(m=>m.k!==key); S.mist.unshift({k:key,q:clean}); S.mist=S.mist.slice(0,80); save();
}
function clearMistake(q){ const key=q.title+'|'+(q.prompt||q.word||q.listen); const l=S.mist.length; S.mist=S.mist.filter(m=>m.k!==key); if(l!==S.mist.length) save(); }

/* ===================== VOZ Y SONIDO ===================== */
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/^de(-|_)DE/i.test(v.lang))||vs.find(v=>/^de/i.test(v.lang))||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function say(t){
  try{ if(!t) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/___/g,'')); u.lang='de-DE'; if(voice) u.voice=voice; u.rate=.88; speechSynthesis.speak(u); }
  catch(e){ toast('Este navegador no tiene voz en alemán'); }
}
let actx=null;
function beep(ok){
  if(!S.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
    const notes= ok? [[660,0],[880,.09]] : [[220,0],[180,.12]];
    notes.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(ok?.18:.06,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.2);});
  }catch(e){}
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);}

/* ===================== HABLAR (reconocimiento de voz del navegador) ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec=null;
function nrm(s){ return String(s).toLowerCase().replace(/ß/g,'ss').replace(/[.,!?¿¡«»"“”„:;()]/g,' ').replace(/[-–—]/g,' ').replace(/['’]/g,'').replace(/\s+/g,' ').trim(); }
function toks(s){ const t=nrm(s); return t? t.split(' ').map(w=>w==='dass'?'das':w) : []; }
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
// palabras iguales, con un poco de margen en las largas (el reconocedor a veces se equivoca en una letra)
function tokEq(a,b){ if(a===b) return true; const L=Math.max(a.length,b.length); return L>=5 && lev(a,b)<=(L>=8?2:1); }
// alinea respetando el orden (subsecuencia común más larga)
function align(exp,got){ const m=exp.length,n=got.length; const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) d[i][j]= tokEq(exp[i],got[j]) ? d[i+1][j+1]+1 : Math.max(d[i+1][j],d[i][j+1]);
  const me=new Array(m).fill(false); let i=0,j=0;
  while(i<m&&j<n){ if(tokEq(exp[i],got[j]) && d[i][j]===d[i+1][j+1]+1){me[i]=true;i++;j++;} else if(d[i+1][j]>=d[i][j+1]) i++; else j++; }
  return {score:d[0][0]/Math.max(1,m), me};
}
function numHeard(raw,n,w){
  const s=String(raw).replace(/(\d)[.\s](?=\d{3}(\D|$))/g,'$1');
  if((s.match(/\d+/g)||[]).some(d=>+d===n)) return true;
  const flat=nrm(raw).replace(/\s/g,''); return flat===nrm(w).replace(/\s/g,'') || flat===nrm(numDe(n));
}
const ARTS=['der','die','das','den','dem','des'];
function speakCheck(q,alts){
  alts=alts.filter(a=>a && a.trim()); if(!alts.length) alts=[''];
  if(q.sm==='num'){ const a=alts.find(x=>numHeard(x,q.num,q.words)); return {ok:!!a,heard:a||alts[0]}; }
  if(q.sm==='ans'){ const re=new RegExp(q.pat); const a=alts.find(x=>re.test(nrm(x))); return {ok:!!a,heard:a||alts[0]}; }
  const exp=toks(q.expect);
  // en artículos solo vale lo primero que entiende (las alternativas pueden "corregir" el artículo)
  const list = q.sm==='art' ? alts.slice(0,1) : alts;
  let best=null;
  for(const a of list){ const g=toks(a); const r=align(exp,g); r.heard=a; r.g=g; if(!best||r.score>best.score) best=r; }
  let ok = exp.length<=3 ? best.score===1 : best.score>=0.8, wrongArt=false, note='';
  if(q.sm==='art'){
    const said=best.g.find(w=>ARTS.includes(w));
    if(said && said!==exp[0]){ ok=false; wrongArt=true; note=`Has dicho «${said}», pero es «${exp[0]}».`; }
    else if(!ok && !said) note='No he oído el artículo: di der, das o die y la palabra.';
  }
  return {ok, heard:best.heard, me:best.me, note, wrongArt};
}
function heardHTML(q,r){
  let h=`<div class="small">Te he entendido:</div><div>«${esc(r.heard||'…')}»</div>`;
  if(r.me && !r.ok && (q.sm==='sent'||q.sm==='art') && (q.read || r.me.some(Boolean))){
    // en rojo lo que falta; si la frase no estaba a la vista, lo que falta se tapa con •••
    const words=q.expect.split(/\s+/); let k=0;
    const out=words.map(w=>{ const n=toks(w).length; const good=r.me.slice(k,k+n).every(Boolean); k+=n;
      return good?`<span class="g">${esc(w)}</span>`:`<span class="r">${q.read?esc(w):'•••'}</span>`; }).join(' ');
    h+=`<div class="small" style="margin-top:8px">${q.read?'En rojo, lo que no he entendido:':'Lo que ya está bien:'}</div><div>${out}</div>`;
  }
  return h;
}
function setMic(on,msg){ const m=$('#mic'); if(m) m.classList.toggle('on',on); const st=$('#micst'); if(st && msg!==undefined) st.textContent=msg; }
function stopRec(){ if(rec){ const r=rec; rec=null; try{ r.abort(); }catch(e){} } }
function noSpeech(){
  openSheet(`<h3>Este navegador no permite hablar</h3><div class="tip"><p>Para la parte de hablar abre la app con <b>Google Chrome</b> (Android) o con <b>Safari</b> (iPhone), actualizados.</p><p>El resto de la app funciona igual.</p></div><button class="big-btn" style="margin-top:14px" data-close>Entendido</button>`);
}
function speakStart(){
  const q=L&&L.cur; if(!q||q.type!=='speak'||L.checked) return;
  if(!SR) return noSpeech();
  if(rec){ stopRec(); return setMic(false,'Toca el micro y habla'); }
  if(navigator.onLine===false) return setMic(false,'Sin conexión: para hablar necesitas internet.');
  try{ speechSynthesis.cancel(); }catch(e){}
  const r=new SR(); rec=r; let done=false;
  r.lang='de-DE'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  r.onstart=()=>{ if(rec===r) setMic(true,'Te escucho… habla ahora'); };
  r.onresult=e=>{ if(rec!==r) return; const res=e.results[e.resultIndex]||e.results[0]; if(!res) return;
    if(!res.isFinal){ $('#heard').innerHTML=`<div>«${esc(res[0].transcript)}»</div>`; return; }
    done=true; rec=null; setMic(false,''); speakResult(q,Array.from(res).map(x=>x.transcript)); };
  r.onerror=e=>{ if(rec!==r) return; rec=null; done=true;
    const m={'no-speech':'No te he oído. Toca el micro y habla un poco más alto.','network':'Sin conexión: para hablar necesitas internet.','audio-capture':'No encuentro el micrófono del móvil.','not-allowed':'Falta el permiso del micrófono.','service-not-allowed':'Falta el permiso del micrófono.','language-not-supported':'Este móvil no reconoce alemán.','aborted':''}[e.error];
    setMic(false, m===undefined?'No ha funcionado ('+e.error+'). Vuelve a tocar el micro.':m);
    if(e.error==='not-allowed'||e.error==='service-not-allowed') openSheet(`<h3>Permiso del micrófono</h3><div class="tip"><p>Para hablar, Chrome necesita permiso para usar el micrófono.</p><p>Toca el <b>candado</b> (o los ⋮ → <b>Información del sitio</b>) → <b>Permisos</b> → <b>Micrófono: Permitir</b>. Si usas la app instalada: Ajustes del móvil → Aplicaciones → Chrome → Permisos → Micrófono.</p></div><button class="big-btn" style="margin-top:14px" data-close>Entendido</button>`);
  };
  r.onend=()=>{ if(rec===r){ rec=null; if(!done) setMic(false,'No te he oído. Toca el micro y vuelve a intentarlo.'); } };
  try{ r.start(); }catch(e){ rec=null; setMic(false,'No se ha podido usar el micrófono.'); }
}
function speakResult(q,alts){
  if(!L||L.cur!==q||L.checked) return;
  const r=speakCheck(q,alts); q._tries=(q._tries||0)+1;
  $('#heard').innerHTML=heardHTML(q,r);
  if(r.ok){ L.checked=true; L.answered++; return showResult(q,true,''); }
  if(!r.wrongArt && q._tries<3){ beep(false); $('#tries').textContent=`${r.note?r.note+' ':''}Intento ${q._tries} de 3: vuelve a tocar el micro.`; setMic(false,'Toca el micro y habla'); return; }
  L.checked=true; L.answered++; $('#tries').textContent='';
  showResult(q,false,r.note||'');
}

let dictFilter='all';
function renderDict(){
  const q=($('#dq')&&$('#dq').value||'').trim().toLowerCase();
  const tags=[['all','Todo'],['t1','Tema 1'],['t2','Tema 2'],['t3','Tema 3'],['fi','Ficha'],['der','der'],['das','das'],['die','die']];
  const list=NOUNS.filter(n=>(dictFilter==='all'||n.t===dictFilter||n.art===dictFilter) && (!q || n.de.toLowerCase().includes(q) || n.es.toLowerCase().includes(q)))
    .sort((a,b)=>a.de.localeCompare(b.de,'de'));
  const head = $('#dq') ? null : `<input class="search" id="dq" type="search" placeholder="Busca en alemán o en español" autocomplete="off">
    <div class="chips" id="dchips"></div>
    <div class="legend"><span style="background:var(--der-l);color:var(--der)">der · azul</span><span style="background:var(--das-l);color:var(--das)">das · verde</span><span style="background:var(--die-l);color:var(--die)">die · rojo</span></div>
    <div class="count" id="dcount"></div><div id="dlist"></div>`;
  if(head){ $('#v-dict').innerHTML=head; $('#dq').addEventListener('input',renderDict); }
  $('#dchips').innerHTML=tags.map(([k,l])=>`<button class="chip ${dictFilter===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  $('#dcount').textContent=`${list.length} palabras · toca una para oírla`;
  $('#dlist').innerHTML=list.map(n=>`<button class="w ${n.art}" data-say="${esc(n.art+' '+n.de)}"><span class="a">${n.art}</span><span><span class="n">${esc(n.de)}</span><br><span class="pl">${esc(plStr(n))}</span></span><span class="es">${esc(n.es)}</span></button>`).join('');
}

/* ===================== TEORÍA ===================== */
// sy('Wort') = palabra que suena al tocarla · A('der','Tisch') = con el artículo en su color
const sy = s => `<button class="sy" data-say="${esc(s)}">${esc(s)}</button>`;
const A = (a,w) => `<button class="sy ${a}" data-say="${esc(a+' '+w)}"><b>${a}</b> ${esc(w)}</button>`;
const go = (id,label) => `<button class="chip" data-go="${id}">▶ ${esc(label)}</button>`;
const tw = h => `<div class="tw"><table>${h}</table></div>`;
function thSec(ic,color,title,body,open){ return `<details class="th"${open?' open':''}><summary><span class="tic" style="background:${color}">${ic}</span>${title}</summary><div class="tb">${body}</div></details>`; }
function renderTheory(){
  const D='<span class="tder">der</span>', S_='<span class="tdas">das</span>', E='<span class="tdie">die</span>';
  let h=`<h2 class="sec">Teoría: las reglas claras</h2><p class="small" style="margin:0 4px 12px">Toca un apartado para abrirlo. Las palabras con fondo se pueden <b>tocar para oírlas</b>.</p>`;

  h+=thSec('1','var(--der)','Artículos: cómo adivinarlos en 5 pasos',`
   <p>Cada sustantivo tiene su artículo: ${D} (masculino), ${S_} (neutro) o ${E} (femenino). Colores de la app: der azul, das verde, die rojo.</p>
   <div class="note"><b>No te fíes del español.</b> El sol es ${A('die','Sonne')}, la luna es ${A('der','Mond')} y la chica es ${A('das','Mädchen')}. Por eso la traducción sale oculta en los ejercicios: tócala solo si no sabes qué significa.</div>
   <div class="step"><span class="n">1</span><div><b>¿Es una persona?</b> Hombre → der, mujer → die.<br>${A('der','Mann')} ${A('der','Lehrer')} ${A('die','Frau')} ${A('die','Lehrerin')}<br><span class="small">Excepciones: ${A('das','Kind')} y ${A('das','Mädchen')}.</span></div></div>
   <div class="step"><span class="n">2</span><div><b>¿Es una palabra compuesta?</b> Manda la <b>última</b> palabra.<br>Kranken + das Haus = ${A('das','Krankenhaus')}<br>Bahn + der Hof = ${A('der','Bahnhof')}<br>Wochen + das Ende = ${A('das','Wochenende')}</div></div>
   <div class="step"><span class="n">3</span><div><b>¿Cómo termina?</b> Es la pista más útil. Mira el apartado <b>2 · Terminaciones</b>.<br>${A('die','Zeitung')} ${A('das','Museum')} ${A('der','Motor')}</div></div>
   <div class="step"><span class="n">4</span><div><b>¿Es de un grupo?</b><br>Días, meses, estaciones y partes del día → ${D}: ${A('der','Montag')} ${A('der','Mai')} ${A('der','Sommer')} ${A('der','Abend')} (pero ${A('die','Nacht')}).<br>Un verbo usado como sustantivo → ${S_}: ${A('das','Essen')} ${A('das','Schwimmen')}</div></div>
   <div class="step"><span class="n">5</span><div><b>¿Nada de lo anterior?</b> Toca memorizarla. Truco: imagina la palabra con su personaje: der = <b>forzudo</b>, das = <b>bebé</b>, die = <b>reina</b>. Cuanto más absurda la escena, mejor.</div></div>
   <div class="note"><b>Regla de oro:</b> aprende cada palabra <b>en bloque y en voz alta</b>: artículo + palabra + plural. «${A('der','Tisch')}, die Tische». Nunca «Tisch» a secas.</div>
   <div class="golinks">${go('a1','Personas y tiempo')}${go('a3','Compuestas')}${go('a4','A memorizar')}</div>`,true);

  h+=thSec('2','var(--der)','Terminaciones que delatan el artículo',`
   ${tw(`<tr><th>Terminación</th><th>Artículo</th><th>Ejemplos</th></tr>
   <tr><td><b>-ung, -heit, -keit, -schaft, -ion, -tät, -ei, -ik</b><br><span class="small">siempre</span></td><td>${E}</td><td>${A('die','Übung')} ${A('die','Möglichkeit')} ${A('die','Gesellschaft')} ${A('die','Produktion')} ${A('die','Qualität')} ${A('die','Musik')}</td></tr>
   <tr><td><b>-e</b><br><span class="small">casi siempre</span></td><td>${E}</td><td>${A('die','Sprache')} ${A('die','Adresse')} ${A('die','Frage')}</td></tr>
   <tr><td><b>-ie, -ur, -enz, -in</b> (mujer)</td><td>${E}</td><td>${A('die','Familie')} ${A('die','Kultur')} ${A('die','Freundin')}</td></tr>
   <tr><td><b>-chen, -um, -ment, -o, -nis</b></td><td>${S_}</td><td>${A('das','Mädchen')} ${A('das','Museum')} ${A('das','Kino')} ${A('das','Büro')} ${A('das','Ergebnis')}</td></tr>
   <tr><td>verbo como sustantivo</td><td>${S_}</td><td>${A('das','Essen')} ${A('das','Unternehmen')}</td></tr>
   <tr><td><b>-or, -ist, -ant, -ling</b></td><td>${D}</td><td>${A('der','Motor')} ${A('der','Spezialist')} ${A('der','Praktikant')} ${A('der','Frühling')}</td></tr>
   <tr><td><b>-er</b> (muchas, no todas)</td><td>${D}</td><td>${A('der','Computer')} ${A('der','Lehrer')}</td></tr>`)}
   <h4>Trampas típicas (memorizar)</h4>
   <p>Acaban en -e pero son der: ${A('der','Name')} ${A('der','Kunde')} ${A('der','Kollege')} · y ${A('das','Ende')}</p>
   <p>Acaban en -er pero no son der: ${A('das','Zimmer')} ${A('das','Theater')} ${A('das','Fenster')} ${A('die','Mutter')}</p>
   <p>Acaba en -o pero es der: ${A('der','Euro')}</p>
   <div class="golinks">${go('a2','Terminaciones')}${go('a7','Ficha del profe')}</div>`);

  h+=thSec('3','var(--die)','Plurales',`
   <p>En plural el artículo es <b>siempre ${E}</b>: der Tisch → <b>die</b> Tische, das Buch → <b>die</b> Bücher.</p>
   <p>No hay una regla perfecta, pero sí <b>tendencias</b> que aciertan casi siempre:</p>
   ${tw(`<tr><th>Si la palabra es…</th><th>Plural</th><th>Ejemplo</th></tr>
   <tr><td>${E} (sobre todo en -e)</td><td><b>-n / -en</b></td><td>die Frage → die Frage<b>n</b><br>die Frau → die Frau<b>en</b></td></tr>
   <tr><td>mujer en <b>-in</b></td><td><b>-innen</b></td><td>die Lehrerin → die Lehrer<b>innen</b></td></tr>
   <tr><td>${D}/${S_} en <b>-er, -el, -en</b></td><td><b>igual</b> (a veces ¨)</td><td>der Lehrer → die Lehrer<br>der Wagen → die Wagen</td></tr>
   <tr><td>${D} corta (1 sílaba)</td><td><b>-e</b> (a veces ¨)</td><td>der Tag → die Tag<b>e</b><br>der Arzt → die <b>Ä</b>rzt<b>e</b></td></tr>
   <tr><td>${S_} corta (1 sílaba)</td><td><b>¨-er</b></td><td>das Buch → die B<b>ü</b>ch<b>er</b><br>das Land → die L<b>ä</b>nd<b>er</b></td></tr>
   <tr><td>extranjera o en vocal (-o, -a, -i, -y)</td><td><b>-s</b></td><td>das Auto → die Auto<b>s</b><br>das Hobby → die Hobby<b>s</b></td></tr>`)}
   <p class="small">Algunas no tienen plural: die Musik, der Fußball.</p>
   <div class="golinks">${go('a5','Plurales')}</div>`);

  h+=thSec('4','var(--das)','ein · eine · kein · keine',`
   ${tw(`<tr><th></th><th class="tder">der</th><th class="tdas">das</th><th class="tdie">die</th><th>plural</th></tr>
   <tr><td>el / la</td><td>der</td><td>das</td><td>die</td><td>die</td></tr>
   <tr><td>un / una</td><td>ein</td><td>ein</td><td><b>eine</b></td><td>–</td></tr>
   <tr><td>ningún</td><td>kein</td><td>kein</td><td><b>keine</b></td><td><b>keine</b></td></tr>`)}
   <p><b>Truco:</b> ein y kein son iguales para der y das. Para die (y el plural) se añade <b>-e</b>.</p>
   <h4>¿ein o der?</h4>
   <p>Algo nuevo → <b>ein</b>. Algo ya conocido → <b>der/das/die</b>.<br>${sy('Das ist ein Bahnhof. Der Bahnhof ist groß.')}</p>
   <h4>¿kein o nicht?</h4>
   <p><b>kein</b> niega un sustantivo: ${sy('Das ist kein Bus.')} ${sy('Ich habe keine Zeit.')}<br><b>nicht</b> niega todo lo demás: ${sy('Ich koche nicht gern.')} ${sy('Das ist nicht der Bahnhof.')}</p>
   <h4>Profesiones: sin artículo</h4>
   <p>${sy('Ich bin Lehrerin.')} ${sy('Er ist Student.')} (¡no «ein Student»!)</p>
   <div class="golinks">${go('a6','ein / kein')}</div>`);

  h+=thSec('5','#8b5cf6','Verbos en presente',`
   ${tw(`<tr><th>Persona</th><th>Español</th><th>wohnen</th><th>sein</th><th>haben</th></tr>
   <tr><td>ich</td><td>yo</td><td>wohn<b>e</b></td><td>bin</td><td>habe</td></tr>
   <tr><td>du</td><td>tú</td><td>wohn<b>st</b></td><td>bist</td><td>hast</td></tr>
   <tr><td>er / sie / es</td><td>él / ella</td><td>wohn<b>t</b></td><td>ist</td><td>hat</td></tr>
   <tr><td>wir</td><td>nosotros</td><td>wohn<b>en</b></td><td>sind</td><td>haben</td></tr>
   <tr><td>ihr</td><td>vosotros</td><td>wohn<b>t</b></td><td>seid</td><td>habt</td></tr>
   <tr><td>sie / Sie</td><td>ellos / usted</td><td>wohn<b>en</b></td><td>sind</td><td>haben</td></tr>`)}
   <p><b>Sie</b> (usted) siempre como el infinitivo: ${sy('Wie heißen Sie?')} ${sy('Woher kommen Sie?')}</p>
   <h4>Casos especiales</h4>
   <p><b>Raíz en -t / -d</b> → se mete una e: ${sy('du arbeitest')} ${sy('er arbeitet')}</p>
   <p><b>Raíz en -s / -ß / -z</b> → con du solo -t: ${sy('du heißt')} ${sy('du tanzt')}</p>
   <p><b>Cambio de vocal, solo con du y er/sie/es:</b><br>lesen → ${sy('du liest')} · sprechen → ${sy('du sprichst')} · sehen → ${sy('er sieht')} · fahren → ${sy('er fährt')}</p>
   <h4>sein o haben</h4>
   <p>La edad va con <b>sein</b>: ${sy('Ich bin 22 Jahre alt.')} (¡no «habe»!) · Tener tiempo libre: ${sy('Ich habe frei.')}</p>

   <div class="golinks">${go('v1','sein y haben')}${go('v2','Presente')}</div>`);

  h+=thSec('6','#8b5cf6','Orden de la frase: el verbo, en el sitio 2',`
   <p>El verbo conjugado es el «rey» de la frase: va <b>siempre en la posición 2</b>. Si empiezas por otra cosa (un día, un lugar…), el sujeto pasa <b>detrás</b> del verbo.</p>

   <p><b>Preguntas sí/no e imperativo:</b> verbo en la <b>posición 1</b>.<br>${sy('Gehst du ins Kino?')} ${sy('Gehen Sie links!')}</p>

  h+=thSec('7','#0ea5b7','Preguntas',`

   <div class="golinks">${go('w1','Tema 1')}</div>`);

  h+=thSec('8','#0ea5b7','am · im · ins · direcciones',`
   ${tw(`<tr><td><b>am</b></td><td>días, partes del día, fin de semana</td><td>${sy('am Montag')} ${sy('am Abend')} ${sy('am Wochenende')}</td></tr>
   <tr><td><b>im</b></td><td>meses y estaciones</td><td>${sy('im Mai')} ${sy('im Sommer')}</td></tr>

   <p>${sy('links')} ← izquierda · ${sy('rechts')} → derecha · ${sy('geradeaus')} ↑ recto<br>${sy('Gehen Sie links!')} ${sy('Fahren Sie geradeaus!')}</p>

  h+=thSec('9','var(--accent)','Números',`
   <p><b>0–12 se memorizan:</b> null, eins, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, ${sy('elf')}, ${sy('zwölf')}.</p>

   <tr><td><b>sch</b></td><td>«sh»</td><td>${sy('Schule')} ${sy('Tisch')}</td></tr>

   <tr><td><b>j</b></td><td>«y»</td><td>${sy('ja')} ${sy('Januar')}</td></tr>

/* ===================== MOTOR DE LECCIONES ===================== */
let L=null; // estado de la lección
function startLesson(qs, o){
  L={queue:qs.slice(),total:qs.length,done:0,cur:null,sel:null,checked:false,retried:new Set(),
     right:0,answered:0,errors:[],xp:0,mode:o.mode||'lesson',unit:o.unit,level:o.level,title:o.title||'',timeEnd:0,tick:null};
  $('#lesson').classList.add('on'); document.body.style.overflow='hidden';
  $('#ltimer').hidden = L.mode!=='blitz';
  $('#lfoot').hidden=false;
  if(L.mode==='blitz'){ L.timeEnd=Date.now()+60000; L.tick=setInterval(blitzTick,200); blitzTick(); }
  nextQ();
}
function updBar(){ const p=L.mode==='blitz'? Math.max(0,(L.timeEnd-Date.now())/60000) : L.done/L.total; $('#lbar').style.width=(p*100)+'%'; }
function nextQ(){
  stopRec(); updBar();
  if(L.mode!=='blitz' && (L.queue.length===0)) return endLesson();
  if(L.mode==='blitz' && L.queue.length<3) L.queue.push(...shuffle(NOUNS).slice(0,20).map(qArticle));
  L.cur=L.queue.shift(); L.sel=null; L.checked=false;
  const f=$('#lfoot'); f.className='lf'; $('#fb').innerHTML='';
  const b=$('#lcheck'); b.textContent='Comprobar'; b.disabled=true;
  $('#lfoot').hidden = (L.cur.type==='match') || L.mode==='blitz';
  renderQ(L.cur);
  if(L.cur.type==='speak'){ b.textContent='Saltar'; b.disabled=false; }
}
// traducción oculta: solo aparece al tocarla (o al tocar la palabra), y sola después de contestar
function esHide(text,label,cls){ cls=cls||'sub';
  return S.showEs ? `<div class="${cls}">${esc(text)}</div>` : `<button class="esbtn" id="esbtn" data-es="${esc(text)}" data-cls="${cls}">${esc(label||'Ver traducción')}</button>`; }
function revealEs(){ const b=$('#esbtn'); if(!b) return; const d=document.createElement('div'); d.className=b.dataset.cls||'sub'; d.textContent=b.dataset.es; b.replaceWith(d); }
function renderQ(q){
  const body=$('#lbody'); let h=`<div class="qt">${esc(q.title)}</div>`;
  if(q.type==='article'){
    h+=`<div class="wordcard" id="wc"><div class="big ${q.word.length>15?'xl':q.word.length>10?'l':''}">${esc(q.word)}</div>${esHide(q.es)}<div class="res" id="wres"></div><button class="spk sm" data-say="${esc(q.word)}" aria-label="Escuchar">${IC.spk}</button></div>
        <div class="arts">${['der','das','die'].map(a=>`<button class="ab ${a}" data-a="${a}">${a}</button>`).join('')}</div>`;
  } else if(q.type==='speak'){
    h+=`<div class="qprompt"><div class="bubble" style="${q.big?'font-size:34px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums':''}">${esc(q.prompt)}</div>${q.listenFirst?`<button class="spk" data-say="${esc(q.listenFirst)}" aria-label="Escuchar">${IC.spk}</button>`:''}</div>`;
    if(q.hint) h+=`<div class="hintwrap">${esHide(q.hint,q.hintLabel,'qsub')}</div>`;
    h+=`<div class="micwrap"><button class="mic" id="mic" aria-label="Hablar">${IC.mic}</button>
      <div class="micst" id="micst">${SR?'Toca el micro y habla':'Este navegador no reconoce la voz. Usa Chrome.'}</div>
      <div class="heard" id="heard"></div><div class="tries" id="tries"></div></div>`;
  } else {
    if(q.listen) h+=`<div class="qprompt"><button class="spk" data-say="${esc(q.listen)}" aria-label="Escuchar" style="width:72px;height:72px;border-radius:20px">${IC.spk}</button><div class="small">Toca para escuchar el número.<br><button class="chip" id="reveal" style="margin-top:6px">No lo oigo: enséñamelo</button><span id="revealed" style="display:block;margin-top:6px;font-size:18px;color:var(--ink)"></span></div></div>`;
    else if(q.prompt) h+=`<div class="qprompt"><div class="bubble" style="${q.big?'font-size:34px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums':''}">${esc(q.prompt)}</div></div>`;
    if(q.type==='choice') h+=`<div class="opts ${q.two||q.options.every(o=>o.length<14)?'two':''}">${q.options.map((o,i)=>`<button class="ob" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    if(q.type==='tiles') h+=`<div class="answer" id="ans"></div><div class="preview" id="prev"></div><div class="bank" id="bank">${q.bank.map((t,i)=>`<button class="tile" data-t="${i}">${esc(t)}</button>`).join('')}</div>`;
    if(q.type==='input') h+=`<input class="inp" id="inp" ${q.numeric?'inputmode="numeric"':''} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.numeric?'Escribe la cifra':'Escribe aquí'}">${q.numeric?'':`<div class="uml">${['ä','ö','ü','ß','Ä','Ö','Ü'].map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div>`}`;
    if(q.type==='match'){ const L1=shuffle(q.pairs.map((p,i)=>[p[0],i])), R=shuffle(q.pairs.map((p,i)=>[p[1],i]));
      h+=`<div class="match"><div class="col">${L1.map(([t,i])=>`<button class="mb" data-side="l" data-k="${i}">${esc(t)}</button>`).join('')}</div><div class="col">${R.map(([t,i])=>`<button class="mb" data-side="r" data-k="${i}">${esc(t)}</button>`).join('')}</div></div>`;
      q._m={l:null,r:null,left:q.pairs.length,err:0}; }
  }
  body.innerHTML=h; body.scrollTop=0;
  if(q.listen) setTimeout(()=>say(q.listen),250);
  if(q.autoSay) setTimeout(()=>say(q.prompt),250);
  if(q.type==='tiles'){ q._picked=[]; }
  const inp=$('#inp'); if(inp){ inp.addEventListener('input',()=>{$('#lcheck').disabled=!inp.value.trim();}); inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()) onCheck();}); setTimeout(()=>inp.focus(),60); }
}
function renderTiles(q){
  const ans=$('#ans'); ans.innerHTML=q._picked.map((ti,pos)=>`<button class="tile" data-p="${pos}">${esc(q.bank[ti])}</button>`).join('');
  $('#bank').querySelectorAll('.tile').forEach(b=>b.classList.toggle('used',q._picked.includes(+b.dataset.t)));
  const txt=q._picked.map(i=>q.bank[i]).join(q.joiner);
  $('#prev').innerHTML= q.joiner==='' && txt ? `Se lee: <b>${esc(txt)}</b>` : '';
  $('#lcheck').disabled=q._picked.length===0;
}
function norm(s){return s.trim().replace(/\s+/g,' ').replace(/[.!?]$/,'');}
function evaluate(q){
  if(q.type==='article') return {ok:L.sel===q.answer};
  if(q.type==='choice') return {ok:q.options[L.sel]===q.answer};
  if(q.type==='tiles'){ const got=q._picked.map(i=>q.bank[i]).join(q.joiner); return {ok:got===q.answer.join(q.joiner)}; }
  if(q.type==='input'){ let v=$('#inp').value; if(q.numeric) v=v.replace(/[.\s]/g,'');
    const ok=q.answers.some(a=>norm(a)===norm(v)); const ci=!ok && q.answers.some(a=>norm(a).toLowerCase()===norm(v).toLowerCase());
    return {ok, note: ci?'Casi: revisa mayúsculas y minúsculas. Sustantivo con MAYÚSCULA, artículo en minúscula.':''}; }
}
function onCheck(){
  const q=L.cur, btn=$('#lcheck');
  if(L.checked){ return nextQ(); }
  if(q.type==='speak'){ L.answered++; L.done++; return nextQ(); } // saltar sin penalizar
  if(btn.disabled) return;
  const r=evaluate(q); L.checked=true; L.answered++;
  showResult(q,r.ok,r.note);
}
function showResult(q,ok,note){
  const f=$('#lfoot'), fb=$('#fb'), btn=$('#lcheck');
  if(q.type==='article'){
    document.querySelectorAll('.ab').forEach(b=>{ b.disabled=true;
      if(b.dataset.a===q.answer) b.classList.add('right'); else if(b.dataset.a===L.sel) b.classList.add('wrongsel'); else b.classList.add('dim'); });
    $('#wc').classList.add(ok?'good':'bad');
    $('#wres').innerHTML=`<span class="${q.answer}">${q.answer}</span> ${esc(q.word)} ${ok?'✓':''}`; }
  if(q.type==='speak'){ stopRec(); const m=$('#mic'); if(m){ m.disabled=true; m.classList.remove('on'); } $('#micst').textContent=''; }
  revealEs();
  if(q.type==='choice'){ document.querySelectorAll('.ob').forEach(b=>{ b.disabled=true; const o=q.options[+b.dataset.i]; if(o===q.answer) b.classList.add('right'); else if(+b.dataset.i===L.sel) b.classList.add('wrong'); }); }
  if(q.type==='tiles') document.querySelectorAll('.tile').forEach(b=>b.disabled=true);
  if(q.type==='input') $('#inp').disabled=true;
  beep(ok); say(q.say);
  if(ok){
    L.right++; L.done++; L.xp+= (L.mode==='exam'?0:1);
    if(L.mode==='mist') clearMistake(q);
    f.className='lf ok';
    fb.innerHTML=`<h4>${IC.check.replace('<svg','<svg width="24" height="24"')} ${pick(['¡Correcto!','¡Muy bien!','¡Exacto!','¡Perfecto!'])}</h4>${q.type!=='choice'||q.sol!==q.answer?`<div class="sol">${esc(q.sol)}</div>`:''}<p>${esc(q.explain||'')}</p>`;
  } else {
    L.errors.push(q); pushMistake(q);
    if((L.mode==='lesson' || L.mode==='mist') && !q._retry){ L.queue.push(Object.assign({},q,{_retry:true,_tries:0,bank:q.bank?shuffle(q.bank):q.bank,options:q.options?shuffle(q.options):q.options})); }
    else L.done++;
    f.className='lf bad';
    fb.innerHTML=`<h4>${IC.cross.replace('<svg','<svg width="24" height="24"')} Incorrecto</h4><div class="sol">Solución: ${esc(q.sol)}</div>${note?`<p><b>${esc(note)}</b></p>`:''}<p>${esc(q.explain||'')}</p>`;
  }
  updBar();
  btn.disabled=false; btn.textContent='Continuar';
}
/* match */
function onMatch(b){
  const q=L.cur, m=q._m; if(b.classList.contains('ok')) return;
  const side=b.dataset.side;
  document.querySelectorAll(`.mb[data-side="${side}"]`).forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); m[side]=b;
  if(side==='l'){ const t=b.textContent; if(/[A-Za-zÄÖÜäöüß]/.test(t) && /^(der|das|die) /.test(t)) say(t); }
  else say(b.textContent);
  if(m.l && m.r){
    if(m.l.dataset.k===m.r.dataset.k){ [m.l,m.r].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true;}); m.left--; beep(true); }
    else { const a=m.l,c=m.r; [a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('no');}); setTimeout(()=>[a,c].forEach(x=>x.classList.remove('no')),400); m.err++; beep(false); }
    m.l=m.r=null;
    if(m.left===0){ L.done++; L.answered++; if(!m.err) L.right++; else L.errors.push({title:q.title,prompt:'Parejas',sol:q.pairs.map(p=>p[0]+' = '+p[1]).join(' · ')});
      L.xp+=2; setTimeout(()=>{ $('#lfoot').hidden=false; const f=$('#lfoot'); f.className='lf ok'; $('#fb').innerHTML=`<h4>${IC.check.replace('<svg','<svg width="24" height="24"')} ¡Todas las parejas!</h4><p>${m.err?`Con ${m.err} fallo${m.err>1?'s':''}.`:'Sin fallos.'}</p>`; const btn=$('#lcheck'); btn.disabled=false; btn.textContent='Continuar'; L.checked=true; updBar(); },250); }
  }
}
/* blitz */
function blitzTick(){
  const left=Math.max(0,L.timeEnd-Date.now()); $('#ltimer').textContent=Math.ceil(left/1000)+' s'; updBar();
  if(left<=0){ clearInterval(L.tick); endLesson(); }
}
function blitzAnswer(a){
  const q=L.cur; const ok=a===q.answer; L.answered++;
  const fl=$('#flash'); fl.style.background= ok?'rgba(19,160,90,.18)':'rgba(229,72,77,.22)'; fl.style.opacity=1; setTimeout(()=>fl.style.opacity=0,160);
  beep(ok);
  if(ok){ L.right++; L.xp+=1; } else { L.errors.push(q); pushMistake(q); toast(`${q.answer} ${q.word}`); }
  nextQ();
}
function endLesson(){
  if(L.tick) clearInterval(L.tick);
  $('#lfoot').hidden=true; $('#ltimer').hidden=true;
  const acc= L.answered? Math.round(L.right/L.answered*100):0;
  let title='¡Lección completada!', sub='Sigue así: mañana otra.';
  let medalColor='#ffc23d';
  let earned=0;
  if(L.mode==='lesson'){
    earned=10+L.xp; const prev=S.done[L.unit]||0; if(L.level>prev) S.done[L.unit]=L.level;
  } else if(L.mode==='blitz'){
    title=`${L.right} aciertos en 60 s`; sub= L.right>S.blitz? '¡Nuevo récord!':'Récord: '+S.blitz; if(L.right>S.blitz) S.blitz=L.right; earned=L.right;
  } else if(L.mode==='exam'){
    const nota=(L.right/L.total*10); title=`Nota: ${nota.toFixed(1).replace('.',',')} / 10`;
    sub = nota>=8?'Muy bien. Ahora repasa los fallos.': nota>=5?'Aprobado, pero hay que subir. Repasa los fallos.':'Suspenso. Repasa la teoría y los fallos antes de repetir.';
    medalColor = nota>=5?'#ffc23d':'#e5484d'; earned=Math.round(nota*3);
  } else { earned=5+L.xp; }

  $('#lbody').innerHTML=`<div class="end">
    <svg class="medal" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="${medalColor}"/><circle cx="60" cy="60" r="40" fill="#fff" opacity=".25"/><path d="m60 30 9 19 21 2-16 14 5 21-19-11-19 11 5-21-16-14 21-2z" fill="#fff"/></svg>
    <h2>${esc(title)}</h2><p>${esc(sub)}</p>
    <div class="kpis"><div class="kpi"><div style="background:#ffc23d">XP</div><b>+${earned}</b></div><div class="kpi"><div style="background:var(--ok)">Aciertos</div><b>${acc}%</b></div><div class="kpi"><div style="background:var(--die)">Fallos</div><b>${L.errors.length}</b></div></div>
    ${errs.length?`<div class="errs"><h3>Repasa esto</h3>${errs.slice(0,12).map(e=>`<div class="err"><div class="q">${esc(e.prompt||e.word||e.listen||'')}</div><div class="s">${esc(e.sol)}</div></div>`).join('')}</div>`:''}
    <button class="big-btn" id="endok" style="margin-top:14px">Continuar</button>
  </div>`;
  updBar(); $('#lbar').style.width='100%';
  save(); renderPath(); renderPractice();
}

  if(t.id==='lx'){ if(L.mode==='blitz'||$('#endok')) return closeLesson(); openSheet(`<h3>¿Salir de la lección?</h3><p class="tip">Perderás el progreso de esta lección.</p><button class="big-btn" id="doexit">Salir</button><button class="ghost" data-close>Seguir estudiando</button>`); return; }
  if(t.id==='doexit'){ closeSheet(); return closeLesson(); }
  if(t.id==='endok') return closeLesson();
  if(t.id==='lcheck') return onCheck();
  if(t.id==='mic') return speakStart();
  if(t.id==='reveal' && L.cur && L.cur.listen){ $('#revealed').textContent=L.cur.listen; t.remove(); return; }
  const q=L.cur; if(!q || L.checked) return;
  if(t.classList.contains('ab')){ if(L.mode==='blitz') return blitzAnswer(t.dataset.a); L.sel=t.dataset.a; document.querySelectorAll('.ab').forEach(b=>b.classList.toggle('sel',b===t)); $('#lcheck').disabled=false; return; }
  if(t.classList.contains('ob')){ L.sel=+t.dataset.i; document.querySelectorAll('.ob').forEach(b=>b.classList.toggle('sel',b===t)); $('#lcheck').disabled=false; return; }
  if(t.dataset.t!==undefined && t.closest('#bank')){ const i=+t.dataset.t; if(!q._picked.includes(i)){ q._picked.push(i); if(q.joiner===' ') say(q.bank[i]); renderTiles(q);} return; }
  if(t.dataset.p!==undefined && t.closest('#ans')){ q._picked.splice(+t.dataset.p,1); renderTiles(q); return; }
  if(t.dataset.c){ const inp=$('#inp'); const s=inp.selectionStart??inp.value.length; inp.value=inp.value.slice(0,s)+t.dataset.c+inp.value.slice(inp.selectionEnd??s); inp.focus(); inp.setSelectionRange(s+1,s+1); $('#lcheck').disabled=!inp.value.trim(); return; }
  if(t.classList.contains('mb')) return onMatch(t);
});
document.addEventListener('keydown',e=>{
  if(!L || !$('#lesson').classList.contains('on')) return;
  if(L.mode==='blitz' && ['1','2','3'].includes(e.key)) return blitzAnswer(['der','das','die'][+e.key-1]);
  if(e.key==='Enter' && document.activeElement && document.activeElement.id!=='inp'){ const b=$('#lcheck'); if(!b.disabled && !$('#lfoot').hidden){ e.preventDefault(); onCheck(); } }
});
function openSheet(html){ $('#sheetbox').innerHTML=html; $('#sheet').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });

renderStats(); renderPath(); renderPractice(); renderTheory();
// App instalable y sin internet (solo cuando se sirve por https, p. ej. GitHub Pages)
if('serviceWorker' in navigator && location.protocol==='https:'){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
